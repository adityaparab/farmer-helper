name: CI

on:
  push:
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    env:
      SECURITY_API_KEY: ""

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Mypy
        run: mypy src

      - name: Coverage
        run: pytest -q --cov=src/farmer_helper --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: artifacts/coverage.xml

      - name: Publish coverage summary
        run: python scripts/write_ci_summary.py coverage artifacts/coverage.xml "Backend Coverage Report"

      - name: Eval regression gate
        run: python scripts/run-evals.py --min-average-score 6.0 --report-out artifacts/eval-report.json

      - name: Upload eval report artifact
        uses: actions/upload-artifact@v6
        with:
          name: eval-report
          path: artifacts/eval-report.json

      - name: Publish eval summary
        run: python scripts/write_ci_summary.py eval artifacts/eval-report.json

  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend tests
        run: npm run test
        working-directory: frontend

      - name: Frontend coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-report
          path: frontend/coverage/cobertura-coverage.xml

      - name: Publish frontend coverage summary
        run: python scripts/write_ci_summary.py coverage frontend/coverage/cobertura-coverage.xml "Frontend Coverage Report"

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
