default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: lint-fix
        name: lint-fix
        entry: ruff check --fix
        language: python
        additional_dependencies:
          - ruff==0.15.0
        types_or: [python, pyi]
      - id: black
        name: black
        entry: python scripts/run_black.py
        language: python
        additional_dependencies:
          - black==25.12.0
        types_or: [python, pyi]
      - id: lint
        name: lint
        entry: ruff check
        language: python
        additional_dependencies:
          - ruff==0.15.0
        types_or: [python, pyi]
      - id: backend-tests
        name: backend-tests
        entry: python scripts/run_pytest.py all
        language: python
        additional_dependencies:
          - pytest>=8.4.1,<9.0.0
          - fastapi>=0.116.0,<1.0.0
          - httpx>=0.28.1,<1.0.0
          - sqlalchemy>=2.0.41,<3.0.0
          - pydantic-settings>=2.10.0,<3.0.0
          - alembic>=1.16.2,<2.0.0
          - python-json-logger>=3.3.0,<4.0.0
          - sentry-sdk>=2.26.0,<3.0.0
          - pypdf>=6.0.0,<7.0.0
          - python-multipart>=0.0.20,<1.0.0
          - psycopg[binary]>=3.2.9,<4.0.0
        always_run: true
        pass_filenames: false
      - id: frontend-lint-fix
        name: frontend-lint-fix
        entry: python scripts/run_frontend_eslint.py --fix
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
      - id: frontend-lint
        name: frontend-lint
        entry: python scripts/run_frontend_eslint.py
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
      - id: frontend-test
        name: frontend-test
        entry: npm --prefix frontend test
        language: system
        always_run: true
        pass_filenames: false
        files: ^frontend/
      - id: frontend-build
        name: frontend-build
        entry: npm --prefix frontend run build
        language: system
        always_run: true
        pass_filenames: false
        files: ^frontend/
      - id: commit-msg-standard
        name: commit-msg-standard
        entry: python scripts/validate_commit_message.py
        language: python
        stages: [commit-msg]
        pass_filenames: true
