repos:
  - repo: local
    hooks:
      - id: lint-fix
        name: lint-fix
        entry: ruff check --fix
        language: python
        additional_dependencies:
          - ruff==0.15.0
        types_or: [python, pyi]
      - id: black
        name: black
        entry: python scripts/run_black.py
        language: python
        additional_dependencies:
          - black==25.12.0
        types_or: [python, pyi]
      - id: lint
        name: lint
        entry: ruff check
        language: python
        additional_dependencies:
          - ruff==0.15.0
        types_or: [python, pyi]
      - id: commit-msg-standard
        name: commit-msg-standard
        entry: python scripts/validate_commit_message.py
        language: python
        stages: [commit-msg]
        pass_filenames: true
