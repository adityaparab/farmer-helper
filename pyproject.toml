[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "farmer-helper"
version = "0.1.0"
description = "Backend-first AI system for grounded agricultural Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.41,<3.0.0",
  "psycopg[binary]>=3.2.9,<4.0.0",
  "alembic>=1.16.2,<2.0.0",
  "python-json-logger>=3.3.0,<4.0.0",
  "sentry-sdk>=2.26.0,<3.0.0",
  "pypdf>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0.0",
  "httpx>=0.28.1,<1.0.0",
  "ruff>=0.12.1,<1.0.0",
  "mypy>=1.16.1,<2.0.0",
  "black>=25.1.0,<26.0.0",
  "pre-commit>=4.2.0,<5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/farmer_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"src/farmer_helper/api/routes/*.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true
mypy_path = ["src"]
plugins = []
